name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      flipper: ${{ steps.filter.outputs.flipper }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flipper:
              - 'flipper-app/**'
              - 'docs/PROTOCOL.md'
            server:
              - 'pi-server/**'
              - 'docs/PROTOCOL.md'

  flipper-app:
    needs: changes
    if: needs.changes.outputs.flipper == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (term_buffer)
        run: |
          cc -Wall -Wextra -Werror -Iflipper-app flipper-app/tests/term_buffer_test.c flipper-app/term_buffer.c -o term_buffer_test
          ./term_buffer_test
      - uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: flipper-app

  pi-server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-server
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo install cross --locked
      - run: cross build --release --target aarch64-unknown-linux-gnu
